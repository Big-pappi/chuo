version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: chuo-postgres
    environment:
      POSTGRES_USER: chuo_user
      POSTGRES_PASSWORD: chuo_password
      POSTGRES_DB: chuo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chuo-network

  redis:
    image: redis:7-alpine
    container_name: chuo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - chuo-network

  backend:
    build: .
    container_name: chuo-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://chuo_user:chuo_password@postgres:5432/chuo_db?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=your-production-secret-key
    depends_on:
      - postgres
      - redis
    networks:
      - chuo-network
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs

volumes:
  postgres_data:
  redis_data:

networks:
  chuo-network:
    driver: bridge
