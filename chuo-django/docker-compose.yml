version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: chuo-postgres
    environment:
      POSTGRES_USER: chuo_user
      POSTGRES_PASSWORD: chuo_password
      POSTGRES_DB: chuo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chuo-network

  redis:
    image: redis:7-alpine
    container_name: chuo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - chuo-network

  backend:
    build: .
    container_name: chuo-backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-change-this-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - DB_NAME=chuo_db
      - DB_USER=chuo_user
      - DB_PASSWORD=chuo_password
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - CORS_ALLOWED_ORIGINS=http://localhost:19006,http://localhost:3000
    depends_on:
      - postgres
      - redis
    networks:
      - chuo-network
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  celery:
    build: .
    container_name: chuo-celery
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-change-this-in-production
      - DB_NAME=chuo_db
      - DB_USER=chuo_user
      - DB_PASSWORD=chuo_password
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    networks:
      - chuo-network
    command: celery -A chuo worker -l info

volumes:
  postgres_data:
  redis_data:

networks:
  chuo-network:
    driver: bridge
